<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Финал — стрим-квест artempencil</title>
<meta name="description" content="Финальная ловушка стрим-квеста artempencil. Успей ответить, пока крутится пила.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero hero--trap">
  <div class="hero__vignette" aria-hidden="true"></div>
  <div class="hero__noise" aria-hidden="true"></div>
  <div class="hero__diagonals" aria-hidden="true"></div>

  <div class="hero__content trap">
    <p class="eyebrow">
      <span class="eyebrow__line" aria-hidden="true"></span>
      Ловушка № 5 · Финал
      <span class="eyebrow__line" aria-hidden="true"></span>
    </p>

    <h1 class="hero__title glitch trap__title" data-text="Последний шанс">Последний<br>шанс</h1>

    <p class="hero__lead trap__intro">
      Бегемот больше не ждёт. Пила уже крутится. Успеешь ответить —
      выйдешь. Не успеешь — останешься здесь.
    </p>

    <div class="trap-screen" id="trap-screen">
      <span class="screen__scanlines" aria-hidden="true"></span>

      <p class="trap-timer" id="final-timer">--</p>

      <p class="trap-screen__riddle">
        Собери ключ из фрагментов, добытых в каждой ловушке, и впиши его целиком.
      </p>

      <ul class="key-parts" id="key-parts" aria-hidden="true"></ul>

      <form class="trap-form" id="trap-form" autocomplete="off">
        <label class="trap-form__label" for="trap-answer">Ключ целиком</label>
        <div class="trap-form__row">
          <input class="input trap-form__input" type="text" id="trap-answer" name="answer" placeholder="впиши ключ" required>
          <button class="btn" type="submit">Ввести</button>
        </div>
      </form>

      <p class="trap-screen__feedback" id="trap-feedback" role="status" aria-live="polite"></p>
    </div>

    <div class="trap-nav">
      <a class="link-ghost" href="index.html">← Вернуться на главную</a>
    </div>
  </div>
</header>

<script src="game-timer.js"></script>
<script src="key-collector.js"></script>
<script src="trap-5.js"></script>
<script src="music-player.js"></script>
</body>
</html>
