<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Останется один — стрим-квест artempencil</title>
<meta name="description" content="Внеочередное испытание стрим-квеста artempencil. Успей нажать последнего выжившего.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero hero--trap">
  <div class="hero__vignette" aria-hidden="true"></div>
  <div class="hero__noise" aria-hidden="true"></div>
  <div class="hero__diagonals" aria-hidden="true"></div>

  <div class="hero__content trap">
    <p class="eyebrow">
      <span class="eyebrow__line" aria-hidden="true"></span>
      Внеочередное испытание
      <span class="eyebrow__line" aria-hidden="true"></span>
    </p>

    <h1 class="hero__title glitch trap__title" data-text="Останется один">Останется один</h1>

    <p class="hero__lead trap__intro">
      Девять клеток. Одна за другой они будут гаснуть сами. Дождись,
      пока останется последняя, и успей нажать — окно очень короткое.
    </p>

    <div class="trap-screen" id="trap-screen">
      <span class="screen__scanlines" aria-hidden="true"></span>
      <p class="trap-screen__progress" id="trap-progress"></p>

      <div class="elim-board" id="elim-board"></div>

      <p class="trap-screen__feedback" id="trap-feedback" role="status" aria-live="polite"></p>
    </div>

  </div>
</header>

<script src="tension-fx.js"></script>
<script src="game-timer.js"></script>
<script src="trap-elimination.js"></script>
<script src="music-player.js"></script>
</body>
</html>
