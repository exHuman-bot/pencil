<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пройди по краю — стрим-квест artempencil</title>
<meta name="description" content="Внеочередное испытание стрим-квеста artempencil. Проведи курсор по узкой дорожке.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero hero--trap">
  <div class="hero__vignette" aria-hidden="true"></div>
  <div class="hero__noise" aria-hidden="true"></div>
  <div class="hero__diagonals" aria-hidden="true"></div>

  <div class="hero__content trap">
    <p class="eyebrow">
      <span class="eyebrow__line" aria-hidden="true"></span>
      Внеочередное испытание
      <span class="eyebrow__line" aria-hidden="true"></span>
    </p>

    <h1 class="hero__title glitch trap__title" data-text="Пройди по краю">Пройди по краю</h1>

    <p class="hero__lead trap__intro">
      Начни с зелёной точки и веди палец или курсор до красной, не
      покидая дорожку. Сорвался — начинай с начала.
    </p>

    <div class="trap-screen" id="trap-screen">
      <span class="screen__scanlines" aria-hidden="true"></span>

      <div class="maze-wrap" id="maze-wrap">
        <svg class="maze-svg" id="maze-svg" viewBox="0 0 500 200" aria-hidden="true">
          <path class="maze-path" d="M20,100 C90,20 140,180 200,100 C260,20 310,180 370,100 C410,60 450,140 480,100"/>
          <path class="maze-path-line" d="M20,100 C90,20 140,180 200,100 C260,20 310,180 370,100 C410,60 450,140 480,100"/>
          <circle class="maze-point maze-start" cx="20" cy="100" r="12"/>
          <circle class="maze-point maze-end" cx="480" cy="100" r="12"/>
        </svg>
      </div>

      <p class="trap-screen__feedback" id="trap-feedback" role="status" aria-live="polite"></p>
    </div>

  </div>
</header>

<script src="tension-fx.js"></script>
<script src="game-timer.js"></script>
<script src="trap-maze.js"></script>
<script src="music-player.js"></script>
</body>
</html>
