<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Линия — стрим-квест artempencil</title>
<meta name="description" content="Простое испытание с вертикальной линией.">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<main class="line-only-page">
  <div class="line-only-stage" id="stage">
    <div class="line-only-task">
      <p class="eyebrow eyebrow--center line-only-task__eyebrow">
        <span class="eyebrow__line" aria-hidden="true"></span>
        Ловушка
        <span class="eyebrow__line" aria-hidden="true"></span>
      </p>
      <h1 class="line-only-task__title glitch" id="task-title" data-text="Вытяни линию до конца">У ТЕБЯ ЧТО-ТО В НОСУ ЗАСТРЯЛО</h1>
      <h1 class="line-only-task__title" data-text="Вытяни линию до конца" style="font-size: 20px;">Я БЫ НА ТВОЕМ МЕСТЕ ТОРОПИЛСЯ ЭТО ВЫТАЩИТЬ</h1>
      <p class="line-only-task__status" id="status" aria-live="polite"></p>
    </div>
    <img class="line-only-float line-only-float--from-right" id="float" src="uploads/images-1.png" alt="" aria-hidden="true">
    <img class="line-only-float line-only-float--from-left" id="float-left" src="uploads/images-2.png" alt="" aria-hidden="true">
    <div class="line-only-frame">
      <img class="line-only-photo line-only-photo--base" src="uploads/pasted-1786715733786-0.png" alt="" aria-hidden="true">
      <div class="line-only-horns" id="horns" aria-hidden="true">
        <span class="line-only-horn line-only-horn--left"></span>
        <span class="line-only-horn line-only-horn--right"></span>
      </div>
      <div class="line-only-block" id="block" aria-label="Линия"></div>
      <div class="line-only-photo-clone" aria-hidden="true">
        <img class="line-only-photo line-only-photo--clone" src="uploads/pasted-1786715733786-0.png" alt="">
      </div>
    </div>
    <div class="line-only-gifs" aria-hidden="true">
      <img class="line-only-gif" src="uploads/1405086887_545369749.gif" alt="">
    </div>
  </div>
</main>
<script src="trap-sleeve.js"></script>
</body>
</html>
