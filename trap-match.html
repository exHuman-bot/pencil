<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Собери пары — стрим-квест artempencil</title>
<meta name="description" content="Внеочередное испытание стрим-квеста artempencil. Сопоставь пары.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero hero--trap">
  <div class="hero__vignette" aria-hidden="true"></div>
  <div class="hero__noise" aria-hidden="true"></div>
  <div class="hero__diagonals" aria-hidden="true"></div>

  <div class="hero__content trap">
    <p class="eyebrow">
      <span class="eyebrow__line" aria-hidden="true"></span>
      Внеочередное испытание
      <span class="eyebrow__line" aria-hidden="true"></span>
    </p>

    <h1 class="hero__title glitch trap__title" data-text="Собери пары">Собери пары</h1>

    <p class="hero__lead trap__intro">
      Вспомни путь, который уже прошёл. Нажми на пункт слева, затем на
      совпадающий справа — если ошибёшься, попробуй снова.
    </p>

    <div class="trap-screen" id="trap-screen">
      <span class="screen__scanlines" aria-hidden="true"></span>

      <div class="match-board">
        <ul class="match-col" id="match-left"></ul>
        <ul class="match-col" id="match-right"></ul>
      </div>

      <p class="trap-screen__feedback" id="trap-feedback" role="status" aria-live="polite"></p>
    </div>

  </div>
</header>

<script src="tension-fx.js"></script>
<script src="game-timer.js"></script>
<script src="trap-match.js"></script>
<script src="music-player.js"></script>
</body>
</html>
