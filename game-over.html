<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Время вышло — стрим-квест artempencil</title>
<meta name="description" content="Время квеста artempencil истекло.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="blackout">
  <div class="blackout__noise" aria-hidden="true"></div>
  <div class="blackout__content">
    <p class="blackout__text blackout__text--done" id="game-over-text">Время вышло. Бегемот забрал тебя себе.</p>
    <a class="btn btn--start" href="start.html">Начать заново</a>
  </div>
</main>

<script>
  (function () {
    var reason = new URLSearchParams(window.location.search).get('reason');
    var messages = {
      click: 'Ты не смог просто ждать. Нетерпение стоило тебе игры.'
    };
    var el = document.getElementById('game-over-text');
    if (el && messages[reason]) el.textContent = messages[reason];
  })();
</script>
<script src="music-player.js"></script>
</body>
</html>
