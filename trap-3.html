<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ловушка №3 — стрим-квест artempencil</title>
<meta name="description" content="Третья ловушка стрим-квеста artempencil. Один из ответов верный — остальные штрафуют.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero hero--trap">
  <div class="hero__vignette" aria-hidden="true"></div>
  <div class="hero__noise" aria-hidden="true"></div>
  <div class="hero__diagonals" aria-hidden="true"></div>

  <div class="hero__content trap">
    <p class="eyebrow">
      <span class="eyebrow__line" aria-hidden="true"></span>
      Ловушка № 3
      <span class="eyebrow__line" aria-hidden="true"></span>
    </p>

    <h1 class="hero__title glitch trap__title" data-text="Четыре двери">Четыре<br>двери</h1>

    <p class="hero__lead trap__intro">

      Одна дверь ведёт дальше. Три другие — просто отнимают время.
      Бегемот не подскажет какая: думай сам, или плати секундами.
    </p>

    <div class="trap-screen" id="trap-screen">
      <span class="screen__scanlines" aria-hidden="true"></span>
      <p class="trap-screen__progress" id="trap-progress"></p>
      <p class="trap-screen__riddle" id="trap-riddle"></p>

      <ul class="trap-choices" id="trap-choices"></ul>

      <p class="trap-screen__feedback" id="trap-feedback" role="status" aria-live="polite"></p>
    </div>

    <div class="trap-nav">
      <a class="link-ghost" href="index.html">← Вернуться на главную</a>
    </div>
  </div>
</header>

<script src="game-timer.js"></script>
<script src="key-collector.js"></script>
<script src="trap-3.js"></script>
<script src="music-player.js"></script>
</body>
</html>
